<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Live Chat Overlay v3.0</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="controls.css">
</head>
<body>
<main class="panel">
  <header class="titlebar">
    <div class="brand"><i></i><b>LIVE v3.0</b><span id="duration">00:00:00</span></div>
    <div class="creator-watermark">ASTOR</div>
    <div class="actions">
      <button id="min" title="Minimize">—</button>
      <button id="close" title="Tutup">×</button>
    </div>
  </header>

  <section class="setup">
    <!-- Row TikTok -->
    <div class="platform-row">
      <label>TikTok LIVE</label>
      <div class="input tiktok-input">
        <span>@</span>
        <input id="tiktok-username" placeholder="Username TikTok" autocomplete="off">
        <button id="tiktok-connect" type="button">Hubungkan</button>
      </div>
      <p id="tiktok-error" class="error-msg"></p>
    </div>

    <!-- Row YouTube -->
    <div class="platform-row">
      <label>YouTube LIVE</label>
      <div class="input youtube-input">
        <span class="yt-prefix">▶</span>
        <input id="youtube-input" placeholder="Link video, @channel, atau Live ID" autocomplete="off">
        <button id="youtube-connect" type="button">Hubungkan</button>
      </div>
      <p id="youtube-error" class="error-msg"></p>
    </div>
  </section>

  <section class="statusbar">
    <div class="status-group">
      <div id="status-tiktok" class="status-pill idle" title="Status TikTok">
        <i class="dot tiktok-dot"></i><span class="pill-name">TT:</span><span class="status-txt">Offline</span>
      </div>
      <div id="status-youtube" class="status-pill idle" title="Status YouTube">
        <i class="dot youtube-dot"></i><span class="pill-name">YT:</span><span class="status-txt">Offline</span>
      </div>
    </div>
    <div class="stats">
      <span title="Penonton aktif">👁 <b id="viewers">—</b></span>
      <span title="Total like">♥ <b id="likes">0</b></span>
    </div>
    <button id="gear" title="Pengaturan">⚙</button>
  </section>

  <section id="top" class="top" hidden>
    <label>TOP VIEWERS</label>
    <div id="top-list"></div>
  </section>

  <section id="join" class="join" hidden>
    <div id="join-avatar" class="mini-avatar">?</div>
    <p><b id="join-name">Penonton</b> baru bergabung</p>
  </section>

  <section id="settings" class="settings" hidden>
    <div class="settings-head">
      <b>Pengaturan Overlay v3.0</b>
      <button id="settings-close" title="Tutup pengaturan">×</button>
    </div>
    <label>Ukuran teks <input id="font" type="range" min="12" max="26" value="16"></label>
    <label>Opasitas <input id="opacity" type="range" min="30" max="100" value="90"></label>
    <div class="size-setting">
      <span>Ukuran jendela</span>
      <div>
        <button data-size="small">Kecil</button>
        <button data-size="medium">Sedang</button>
        <button data-size="large">Besar</button>
      </div>
    </div>
    <label>Selalu di atas <input id="topmost" type="checkbox" checked></label>
    <label>Klik tembus <input id="passthrough" type="checkbox"></label>
    <p class="shortcut-help">Matikan klik-tembus kapan saja: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></p>
  </section>

  <section id="feed" class="feed">
    <div id="empty" class="empty">
      <strong>•••</strong>
      <p>Komentar TikTok & YouTube akan muncul di sini</p>
    </div>
  </section>

  <footer>
    <span id="count">0 komentar</span>
    <span class="resize-help">↘ tarik tepi untuk resize</span>
    <button id="disconnect-all" hidden>Putuskan Semua</button>
  </footer>
</main>

<script src="renderer.js"></script>
</body>
</html>
